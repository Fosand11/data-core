# Render Blueprint: ONE free web service built from docker/php/Dockerfile.prod (its
# last stage runs PHP-FPM, Caddy and the queue worker together) plus an external
# PostgreSQL on Neon. Values marked `sync: false` are asked for when the Blueprint is
# created and are never stored in git.
#
# Run the migrations and `php artisan demo:install` from your own machine against the
# Neon database (see the Render notes in the project README): nothing migrates
# automatically when the container starts.
services:
  - type: web
    name: insightflow
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./docker/php/Dockerfile.prod
    dockerContext: .
    # /up is Laravel's built-in check: it never touches the database. /health goes
    # through the session middleware (database-backed here), so each check would wake
    # Neon and burn its free compute hours.
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: InsightFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # The service's public URL, e.g. https://insightflow.onrender.com
      - key: APP_URL
        sync: false
      # Render's edge is the only way in, so its X-Forwarded-* headers can be trusted.
      - key: APP_TRUST_PROXIES
        value: "true"
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Neon (use the direct host, not the "-pooler" one).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # No Redis: the database holds sessions, cache and the queue.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log

      # Public demo on Gemini's free tier: keep the limits low to protect the quota.
      - key: DASHBOARD_AI_DRIVER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DASHBOARD_AI_RATE_LIMIT_PER_MINUTE
        value: "2"
      - key: DASHBOARD_AI_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: DASHBOARD_AI_GLOBAL_PER_DAY
        value: "60"
      - key: TENANCY_SEED_DEMO_DATA
        value: "true"
