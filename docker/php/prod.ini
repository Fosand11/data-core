; Production PHP settings (loaded after the image defaults).
expose_php = Off
memory_limit = 256M
; Uploads of CSV/Excel files (the app accepts up to 5 MB; the margin covers the form fields).
upload_max_filesize = 6M
post_max_size = 8M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code never changes inside a running container, so skip file stat calls.
opcache.validate_timestamps = 0
