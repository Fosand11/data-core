; Runs the three processes of the single-container deployment. Logs go to the
; container's stdout/stderr so the host's log viewer shows them.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
environment=XDG_DATA_HOME="/tmp/caddy-data",XDG_CONFIG_HOME="/tmp/caddy-config"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The queue lives in the database. --memory restarts the worker before it can
; exhaust a small instance; supervisord starts it again.
[program:worker]
command=php artisan queue:work database --sleep=1 --tries=1 --timeout=210 --memory=96
directory=/var/www/html
user=www-data
autorestart=true
stopwaitsecs=220
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
